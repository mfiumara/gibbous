name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # >= 22.18: runs the server's .ts files without flags
          cache: pnpm
      - name: git identity (tests make commits)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # A real `node server/main.ts` on a throwaway home over the scripted fake Hermes (no model, no real Hermes):
      # sign-in, /api/state, folder picker, media, reveal, project + thread + turn, worktree, terminal.
      - name: server boot smoke
        run: node e2e/boot-smoke.ts
