[package]
name = "gibbous"
version = "1.2.0"
description = "Gibbous for Windows and Linux: a native window around your Gibbous server"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "gibbous_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-window-state = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
