# XcodeGen spec for the Gibbous iOS shell and the Mac app (target GibbousMac, sources in ../desktop). `xcodegen`
# (or scripts/build-ios-app.sh) writes Gibbous.xcodeproj, which is generated and gitignored: edit this file, not the
# project. Both apps share bundle id dev.gibbous.ios: one App Store Connect record, universal purchase.
name: Gibbous
options:
  bundleIdPrefix: dev.gibbous
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 6726M85H57
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Gibbous:
    type: application
    platform: iOS
    sources:
      - path: Gibbous
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gibbous.ios
        PRODUCT_NAME: Gibbous
        INFOPLIST_FILE: Gibbous/Info.plist
        # Push Notifications capability (aps-environment). A free Apple account can't sign it: set this to
        # Gibbous/Gibbous-NoPush.entitlements (Build Settings → Code Signing Entitlements) to build without push.
        CODE_SIGN_ENTITLEMENTS: Gibbous/Gibbous.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  # The Mac app (desktop/Gibbous.swift), sandboxed for TestFlight / the Mac App Store. scripts/build-mac-app.sh still
  # builds the unsandboxed ad-hoc dev.gibbous.desktop copy with swiftc.
  GibbousMac:
    type: application
    platform: macOS
    sources:
      - path: ../desktop
        excludes:
          - AppIcon-1024.png
          - make-icons.sh
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gibbous.ios
        PRODUCT_NAME: Gibbous
        INFOPLIST_FILE: ../desktop/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # App Sandbox + the read-only ~/.gibbous exception (zero-setup sign-in; fine for TestFlight). For App Store
        # review use ../desktop/Gibbous-AppStore.entitlements (no exception; the user pastes a sign-in link once).
        CODE_SIGN_ENTITLEMENTS: ../desktop/Gibbous.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
  GibbousUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GibbousUITests
    dependencies:
      - target: Gibbous
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gibbous.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gibbous
schemes:
  Gibbous:
    build:
      targets:
        Gibbous: all
        GibbousUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GibbousUITests
    archive:
      config: Release
  GibbousMac:
    build:
      targets:
        GibbousMac: all
    run:
      config: Debug
    archive:
      config: Release
