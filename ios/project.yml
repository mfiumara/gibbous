# XcodeGen spec for the Gibbous iOS shell. `xcodegen` (or scripts/build-ios-app.sh) writes Gibbous.xcodeproj,
# which is generated and gitignored: edit this file, not the project.
name: Gibbous
options:
  bundleIdPrefix: dev.gibbous
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6726M85H57
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Gibbous:
    type: application
    platform: iOS
    sources:
      - path: Gibbous
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gibbous.ios
        PRODUCT_NAME: Gibbous
        INFOPLIST_FILE: Gibbous/Info.plist
        # Push Notifications capability (aps-environment). A free Apple account can't sign it: set this to
        # Gibbous/Gibbous-NoPush.entitlements (Build Settings → Code Signing Entitlements) to build without push.
        CODE_SIGN_ENTITLEMENTS: Gibbous/Gibbous.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  GibbousUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GibbousUITests
    dependencies:
      - target: Gibbous
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gibbous.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gibbous
schemes:
  Gibbous:
    build:
      targets:
        Gibbous: all
        GibbousUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GibbousUITests
    archive:
      config: Release
