# Gibbous desktop app for Windows and Linux (desktop-tauri/, Tauri v2). macOS keeps the Swift app (desktop/).
# Runs on a desktop-v* tag (draft GitHub release with the installers) or by hand (artifacts only).
name: desktop

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop-tauri/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: Install the Tauri CLI
        run: npm ci --no-audit --no-fund

      - name: Unit tests (link/sign-in helpers)
        working-directory: desktop-tauri/src-tauri
        run: cargo test --lib

      - name: Build installers
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Build and attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-tauri
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Gibbous desktop ${{ github.ref_name }}
          releaseBody: Gibbous for Windows (.exe / .msi) and Linux (.deb / .AppImage). macOS uses the notarized DMG.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: gibbous-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
